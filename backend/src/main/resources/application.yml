spring:
  datasource:
    url: "jdbc:postgresql://${FLIPBOT_DB_HOST:localhost}:${FLIPBOT_DB_PORT:5433}/${FLIPBOT_DB_NAME:flipbot_pr74}"
    username: ${FLIPBOT_DB_USER:postgres}
    password: ${FLIPBOT_DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/schema
    table: flipbot_schema_history
    baseline-version: 100
    baseline-description: working-local-schema
    baseline-on-migrate: false
    clean-disabled: true

  web:
    error:
      include-stacktrace: never
      include-exception: false

server:
  port: 8081
