name: Publish reviewed Flipbot changes
on:
  push:
    branches: [maintenance/publish-public-sync-20261113]
    paths: [.github/workflows/publish-reviewed-sync-20261113.yml]
permissions:
  contents: write
jobs:
  stage-reviewed-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: daf94ee6b44531a1db24d1b4b0f6c045ef5fb757
      - name: Verify and stage the two reviewed commits
        shell: bash
        run: |
          set -euo pipefail
          base=daf94ee6b44531a1db24d1b4b0f6c045ef5fb757
          expected=402709f7e5c0bbd7d17d6926c62be4ae3a60eb87
          bundle="$RUNNER_TEMP/flipbot-reviewed.bundle"
          printf '%s' '' | base64 --decode > "$bundle"
          echo "72ef0764c0a35e78e41de086891b5034f1258023fcacb7dec90be1070fc1fbd9  $bundle" | sha256sum --check
          git bundle verify "$bundle"
          git fetch --no-tags "$bundle" HEAD:refs/heads/public-sync/20261113
          test "$(git rev-parse refs/heads/public-sync/20261113)" = "$expected"
          test "$(git rev-list --count "$base..$expected")" = 2
          git merge-base --is-ancestor "$base" "$expected"
          git diff --check "$base" "$expected"
          git push origin refs/heads/public-sync/20261113:refs/heads/public-sync/20261113
