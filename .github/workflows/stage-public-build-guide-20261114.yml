name: Stage reviewed build documentation
on:
  push:
    branches: [maintenance/publish-public-sync-20261113]
    paths: [.github/workflows/stage-public-build-guide-20261114.yml]
permissions:
  contents: write
jobs:
  stage-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 402709f7e5c0bbd7d17d6926c62be4ae3a60eb87
      - name: Verify and stage documentation
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/guide.bundle"
          printf '%s' '' | base64 --decode > "$bundle"
          echo "56936214bdd59a789e4c42853b805c9b8629b520a8d009796b423becfebc4745  $bundle" | sha256sum --check
          git bundle verify "$bundle"
          git fetch --no-tags "$bundle" HEAD:refs/heads/public-sync/20261114-docs
          test "$(git rev-parse refs/heads/public-sync/20261114-docs)" = "895462069229d17314b01e32ba75678d77a34cd1"
          test "$(git rev-parse 895462069229d17314b01e32ba75678d77a34cd1^)" = "402709f7e5c0bbd7d17d6926c62be4ae3a60eb87"
          git diff --check 402709f7e5c0bbd7d17d6926c62be4ae3a60eb87 895462069229d17314b01e32ba75678d77a34cd1
          printf '%s\n' README.md docs/build-backend-panel.md | diff - <(git diff --name-only 402709f7e5c0bbd7d17d6926c62be4ae3a60eb87 895462069229d17314b01e32ba75678d77a34cd1)
          git push origin refs/heads/public-sync/20261114-docs:refs/heads/public-sync/20261114-docs
